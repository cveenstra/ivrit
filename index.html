<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ivrit · Learn Hebrew</title>
  <meta name="description" content="Bite-sized modern Hebrew lessons with flashcards, a letters course with tracing, and vowel points you can switch off.">
  <meta name="theme-color" content="#1f5aa6">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Serif+Hebrew:wght@500&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="brand" data-nav="home" aria-label="Home">
      <img src="assets/icon.svg" alt="" width="30" height="30">
      <span>Ivrit</span>
    </button>
    <div class="stats" aria-label="Your progress">
      <button class="niq-toggle" id="niq" type="button" aria-pressed="true" title="Show or hide vowel points (niqqud)"><span class="he" lang="he">נִקּוּד</span></button>
      <span class="cloud off" id="cloud" hidden></span>
      <span class="stat streak" title="Day streak"><span class="ico" aria-hidden="true">🔥</span><b id="stat-streak">0</b></span>
      <span class="stat xp" title="Total XP"><span class="ico" aria-hidden="true">⭐</span><b id="stat-xp">0</b></span>
    </div>
  </header>

  <main id="app" tabindex="-1"><p class="loading">Loading…</p></main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button data-nav="home" class="on"><span aria-hidden="true">🗺️</span>Learn</button>
    <button data-nav="letters"><span aria-hidden="true">א</span>Letters</button>
    <button data-nav="cards"><span aria-hidden="true">🃏</span>Cards</button>
    <button data-nav="review"><span aria-hidden="true">🔁</span>Review</button>
    <button data-nav="about"><span aria-hidden="true">ℹ️</span>About</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
